name: Build JobMaster AI APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set -e
          echo "=== Working directory: $(pwd) ==="
          ls -la
          if [ ! -f gradlew ]; then
            echo "Generating Gradle Wrapper..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew
          echo "=== Running assembleDebug ==="
          ./gradlew assembleDebug --stacktrace
          echo "=== BUILD SUCCESSFUL ==="
          ls -la app/build/outputs/apk/debug/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobmaster-ai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Compute SHA-256 (Part XXV proof)
        run: |
          echo "=== SHA-256 of APK ==="
          find app/build/outputs/apk -name "*.apk" -exec sha256sum {} \; || echo "No APK found"
          echo "=== END ==="

      - name: Summary
        run: |
          echo "## JobMaster AI APK Build — Part XXV" >> $GITHUB_STEP_SUMMARY
          echo "- Status: SUCCESS" >> $GITHUB_STEP_SUMMARY
          echo "- Artifact: jobmaster-ai-debug-apk" >> $GITHUB_STEP_SUMMARY
          echo "- SHA-256 printed in job logs" >> $GITHUB_STEP_SUMMARY
          echo "- Install: adb install app-debug.apk (exit 0 required)" >> $GITHUB_STEP_SUMMARY
          echo "- Then capture cold-start dashboard screenshot" >> $GITHUB_STEP_SUMMARY
